<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dukan Wala</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Slackside+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main">
        <div id="top">
            <div>Dukan Wala</div>
        </div>
        <button id="add-items">Add items</button>

        <form id="product-form" class="hidee">

            <label for="product-img">Product Image</label>
            <input type="text" id="product-img" placeholder="Enter image URL">

            <label for="product-name">Product Name</label>
            <input type="text" id="product-name" placeholder="Enter product name">

            <label for="product-weight">Weight</label>
            <input type="text" id="product-weight" placeholder="e.g. 100g">

            <label for="product-price">Price</label>
            <input type="number" id="product-price" placeholder="Enter price">

            <button type="submit" id="addproducts">Add Product</button>
            <button type="button" id="closebtn">Close</button>

        </form>

        <div id="category-name">Dairy Products</div>

        <div id="itemss">

            <div class="item">
                <img src="https://cdn.grofers.com/cdn-cgi/image/f=auto,fit=scale-down,q=70,metadata=none,w=450/da/cms-assets/cms/product/f53c1ea1-cfa0-438b-a14c-b4f5ebeed7dd.png"
                    alt="Curd">
                <div class="details">
                    <p class="item-name">Curd</p>
                    <p class="item-weight">100g</p>
                    <p class="item-price">Price : ₹20</p>
                </div>
                <button class="add-cart">Add to cart</button>
            </div>

            <div class="item">
                <img src="https://cdn.grofers.com/cdn-cgi/image/f=auto,fit=scale-down,q=70,metadata=none,w=450/da/cms-assets/cms/product/f53c1ea1-cfa0-438b-a14c-b4f5ebeed7dd.png"
                    alt="Curd">
                <div class="details">
                    <p class="item-name">Curd</p>
                    <p class="item-weight">500g</p>
                    <p class="item-price">Price : ₹50</p>
                </div>
                <button class="add-cart">Add to cart</button>
            </div>

            <div class="item">
                <img src="https://cdn.grofers.com/cdn-cgi/image/f=auto,fit=scale-down,q=70,metadata=none,w=450/da/cms-assets/cms/product/f53c1ea1-cfa0-438b-a14c-b4f5ebeed7dd.png"
                    alt="Curd">
                <div class="details">
                    <p class="item-name">Curd</p>
                    <p class="item-weight">1kg</p>
                    <p class="item-price">Price : ₹90</p>
                </div>
                <button class="add-cart">Add to cart</button>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
